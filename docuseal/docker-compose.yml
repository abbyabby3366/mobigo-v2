services:
  app:
    depends_on:
      postgres:
        condition: service_healthy
    image: docuseal/docuseal:3.2.0
    ports:
      - 3000:3000
    volumes:
      - docuseal_data:/data/docuseal
      - ./app/views:/app/app/views
      - ./app/controllers:/app/app/controllers
      - ./app/models:/app/app/models
      - ./app/jobs:/app/app/jobs
      - ./lib:/app/lib
      - ./config:/app/config
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      - TZ=Asia/Singapore
      - FORCE_SSL=${HOST}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/docuseal

  postgres:
    image: postgres:18
    volumes:
      - pg_data:/var/lib/postgresql/18/docker
    environment:
      - TZ=Asia/Singapore
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=docuseal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:latest
    command: caddy reverse-proxy --from $HOST --to app:3000
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - caddy_data:/data/caddy
    environment:
      - HOST=${HOST}

  whatsapp:
    build:
      context: ../whatsapp-server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - 4000:4000
    volumes:
      - whatsapp_sessions:/app/sessions
    env_file:
      - path: ../whatsapp-server/.env
        required: false
    environment:
      - PORT=4000
      - TZ=Asia/Singapore
      - DOCUSEAL_API_URL=http://app:3000

volumes:
  pg_data:
  docuseal_data:
  caddy_data:
  whatsapp_sessions:

