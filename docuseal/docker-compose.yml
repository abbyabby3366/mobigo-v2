services:
  app:
    depends_on:
      postgres:
        condition: service_healthy
    image: docuseal/docuseal:latest
    ports:
      - 3000:3000
    volumes:
      - docuseal_data:/data/docuseal
      - ./app/views:/app/app/views
      - ./app/controllers:/app/app/controllers
      - ./app/models:/app/app/models
      - ./app/jobs:/app/app/jobs
      - ./lib:/app/lib
      - ./config:/app/config
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      - FORCE_SSL=${HOST}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/docuseal

  postgres:
    image: postgres:18
    volumes:
      - pg_data:/var/lib/postgresql/18/docker
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docuseal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:latest
    command: caddy reverse-proxy --from $HOST --to app:3000
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - caddy_data:/data/caddy
    environment:
      - HOST=${HOST}

volumes:
  pg_data:
  docuseal_data:
  caddy_data:

